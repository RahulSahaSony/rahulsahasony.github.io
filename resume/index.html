  <main>

            </svg>
            Download PDF
          </button>
          <button id="print-resume" class="btn btn-secondary">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            </svg>

        <div class="resume-content">
          <div class="resume-header">
            <h2 id="resume-name"></h2>

            <div class="contact-info">
              <p id="resume-contact"></p>
            </div>
          </div>
          
          <div class="resume-section">
            <h3>EXPERIENCE</h3>
            <div id="resume-experience"></div>
          </div>
          
          <div class="resume-section">
            <h3>SELECTED PROJECTS</h3>

          </div>
          
          <div class="resume-section">
            <h3>EDUCATION</h3>

          </div>
          
          <div class="resume-section">

  <script src="/assets/profile.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Update resume header
      document.getElementById('resume-name').textContent = profile.name;
      document.getElementById('resume-headline').textContent = profile.headline;
      document.getElementById('resume-contact').innerHTML = 
        profile.email + ' • ' + profile.location + ' • ' + 
        '<a href="' + profile.linkedin + '" target="_blank" rel="noopener noreferrer">LinkedIn</a> • ' + 
        '<a href="' + profile.github + '" target="_blank" rel="noopener noreferrer">GitHub</a>';
      
      // Render experience
      const resumeExperienceContainer = document.getElementById('resume-experience');
      if (resumeExperienceContainer && profile.experience) {
        resumeExperienceContainer.innerHTML = profile.experience.map(exp => `
          <div class="resume-item">
            <h4>${exp.role} — ${exp.company}</h4>
            <p>${exp.dates} — ${exp.location}</p>
            <ul>
              ${exp.bullets.map(bullet => `<li>${bullet}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      }
      
      // Render projects
      const resumeProjectsContainer = document.getElementById('resume-projects');
      if (resumeProjectsContainer && profile.featuredProjects) {
        resumeProjectsContainer.innerHTML = profile.featuredProjects.map(project => `
          <div class="resume-item">
            <h4>${project.title}</h4>
            <p>${project.description}</p>
            <p><strong>Impact:</strong> ${project.impact}</p>
            <p><strong>Technologies:</strong> ${project.technologies.join(', ')}</p>
          </div>
        `).join('');
      }
      
      // Render education
      const resumeEducationContainer = document.getElementById('resume-education');
      if (resumeEducationContainer && profile.education) {
        resumeEducationContainer.innerHTML = profile.education.map(edu => `
          <div class="resume-item">
            <h4>${edu.degree} — ${edu.school}</h4>
            <p>${edu.dates} — ${edu.location}</p>
            ${edu.gpa !== 'N/A' ? `<p>GPA: ${edu.gpa}</p>` : ''}
          </div>
        `).join('');
      }
      
      // Render skills
      const resumeSkillsContainer = document.getElementById('resume-skills');
      if (resumeSkillsContainer && profile.skills) {
        resumeSkillsContainer.innerHTML = Object.entries(profile.skills).map(([category, skills]) => `
          <div class="resume-item">
            <h4>${category}:</h4>
            <p>${skills.join(', ')}</p>
          </div>
        `).join('');
      }
    });
  </script>
