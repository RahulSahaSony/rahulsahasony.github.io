<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Rahul Saha</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <nav>
    <div class="container nav-container">
      <div class="nav-logo">RS</div>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/about/" class="nav-link">About</a></li>
        <li><a href="/projects/" class="nav-link">Projects</a></li>
        <li><a href="/experience/" class="nav-link">Experience</a></li>
        <li><a href="/resume/" class="nav-link">Resume</a></li>
        <li><a href="/contact/" class="nav-link">Contact</a></li>
      </ul>
      <button class="theme-toggle" id="theme-toggle">🌙</button>
      <button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>
    </div>
  </nav>

  <main>
    <div class="container">
      <section class="section">
        <h1 class="section-title">Resume</h1>
        <div class="resume-actions">
          <button id="download-resume" class="btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Download PDF
          </button>
          <button id="print-resume" class="btn btn-secondary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
              <polyline points="6,9 6,2 18,2 18,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="6" y="14" width="12" height="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Print
          </button>
        </div>
        <div class="resume-content">
          <div class="resume-header">
            <h2 id="resume-name"></h2>
            <p id="resume-headline"></p>
            <div class="contact-info">
              <p id="resume-contact"></p>
            </div>
          </div>
          
          <div class="resume-section">
            <h3>EXPERIENCE</h3>
            <div id="resume-experience"></div>
          </div>
          
          <div class="resume-section">
            <h3>SELECTED PROJECTS</h3>
            <div id="resume-projects"></div>
          </div>
          
          <div class="resume-section">
            <h3>EDUCATION</h3>
            <div id="resume-education"></div>
          </div>
          
          <div class="resume-section">
            <h3>SKILLS</h3>
            <div id="resume-skills"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container footer-container">
      <div>© 2025 Rahul Saha. Built with HTML, CSS & JavaScript.</div>
      <div class="footer-links">
        <a href="https://github.com/rahulsahasony" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://linkedin.com/in/rahulsahasony" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="mailto:rahulsahasony@gmail.com">Email</a>
      </div>
    </div>
  </footer>

  <script src="/assets/profile.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Update resume header
      document.getElementById('resume-name').textContent = profile.name;
      document.getElementById('resume-headline').textContent = profile.headline;
      document.getElementById('resume-contact').innerHTML = 
        profile.email + ' • ' + profile.location + ' • ' + 
        '<a href="' + profile.linkedin + '" target="_blank" rel="noopener noreferrer">LinkedIn</a> • ' + 
        '<a href="' + profile.github + '" target="_blank" rel="noopener noreferrer">GitHub</a>';
      
      // Render experience
      const resumeExperienceContainer = document.getElementById('resume-experience');
      if (resumeExperienceContainer && profile.experience) {
        resumeExperienceContainer.innerHTML = profile.experience.map(exp => `
          <div class="resume-item">
            <h4>${exp.role} — ${exp.company}</h4>
            <p>${exp.dates} — ${exp.location}</p>
            <ul>
              ${exp.bullets.map(bullet => `<li>${bullet}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      }
      
      // Render projects
      const resumeProjectsContainer = document.getElementById('resume-projects');
      if (resumeProjectsContainer && profile.featuredProjects) {
        resumeProjectsContainer.innerHTML = profile.featuredProjects.map(project => `
          <div class="resume-item">
            <h4>${project.title}</h4>
            <p>${project.description}</p>
            <p><strong>Impact:</strong> ${project.impact}</p>
            <p><strong>Technologies:</strong> ${project.technologies.join(', ')}</p>
          </div>
        `).join('');
      }
      
      // Render education
      const resumeEducationContainer = document.getElementById('resume-education');
      if (resumeEducationContainer && profile.education) {
        resumeEducationContainer.innerHTML = profile.education.map(edu => `
          <div class="resume-item">
            <h4>${edu.degree} — ${edu.school}</h4>
            <p>${edu.dates} — ${edu.location}</p>
            ${edu.gpa !== 'N/A' ? `<p>GPA: ${edu.gpa}</p>` : ''}
          </div>
        `).join('');
      }
      
      // Render skills
      const resumeSkillsContainer = document.getElementById('resume-skills');
      if (resumeSkillsContainer && profile.skills) {
        resumeSkillsContainer.innerHTML = Object.entries(profile.skills).map(([category, skills]) => `
          <div class="resume-item">
            <h4>${category}:</h4>
            <p>${skills.join(', ')}</p>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
