<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // Redirect all unknown routes to index.html with the original path in ?p=
      // This enables BrowserRouter on GitHub Pages.
      const path = window.location.pathname + window.location.search;
      const base = window.location.origin + (window.location.pathname.split("/").slice(0, 2).join("/") || "");
      // If deployed under /<repo>/..., we keep the first segment after domain.
      // Example: /my-repo/about -> /my-repo/?p=/my-repo/about
      window.location.replace(window.location.origin + "/?p=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
