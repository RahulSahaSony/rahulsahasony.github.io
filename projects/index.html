  <script src="/assets/profile.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Extract all unique technologies
      const allTechnologies = new Set();
      profile.projects.forEach(project => {
        project.technologies.forEach(tech => allTechnologies.add(tech));
      });
      
      // Render filter chips
      const filterChipsContainer = document.getElementById('filter-chips');
      if (filterChipsContainer) {
        Array.from(allTechnologies).sort().forEach(tech => {
          const chip = document.createElement('button');
          chip.className = 'filter-chip';
          chip.setAttribute('data-filter', tech);
          chip.textContent = tech;
          filterChipsContainer.appendChild(chip);
        });
      }
      
      // Render projects
      const projectsContainer = document.getElementById('projects-container');
      if (projectsContainer && profile.projects) {
        projectsContainer.innerHTML = profile.projects.map(project => `
          <div class="card project-card" data-tags="${project.technologies.join(',')}">
            <div class="project-header">
              <h3 class="project-title">${project.title}</h3>
              <div class="project-links">
                ${project.github ? `
                  <a href="${project.github}" class="project-link" target="_blank" rel="noopener noreferrer" title="GitHub">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                      <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </a>
                ` : ''}
                ${project.demo ? `
                  <a href="${project.demo}" class="project-link" target="_blank" rel="noopener noreferrer" title="Demo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <polyline points="15,3 21,3 21,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <line x1="10" y1="14" x2="21" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </a>
                ` : ''}
              </div>
            </div>
            <p class="project-description">${project.description}</p>
            <p class="project-impact">Impact: ${project.impact}</p>
            <div class="project-tags">
              ${project.technologies.map(tech => `<span class="tag">${tech}</span>`).join('')}
            </div>
          </div>
        `).join('');
      }
      
      // Add event listeners to filter chips
      const filterChips = document.querySelectorAll('.filter-chip');
      const projectCards = document.querySelectorAll('.project-card');
      
      filterChips.forEach(chip => {
        chip.addEventListener('click', function() {
          // Update active chip
          filterChips.forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          
          // Filter projects
          const filter = this.getAttribute('data-filter');
          
          projectCards.forEach(card => {
            if (filter === 'all') {
              card.style.display = 'flex';
            } else {
              const tags = card.getAttribute('data-tags').split(',');
              if (tags.includes(filter)) {
                card.style.display = 'flex';
              } else {
                card.style.display = 'none';
              }
            }
          });
        });
      });
    });
  </script>
