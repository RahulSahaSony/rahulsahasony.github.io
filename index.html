<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Saha Sony</title>
    <style>
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            font-size: 1.2em;
            color: #333;
        }
        .stat {
            margin: 0 10px;
        }
        .stat-label {
            font-weight: bold;
            font-size: 1.1em;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Portfolio</h1>
    </header>
    <main>
        <section>
            <img src="profile.jpg" alt="Profile Photo" />
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Projects:</span>
                    <span>10</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Followers:</span>
                    <span>200</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Following:</span>
                    <span>150</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
