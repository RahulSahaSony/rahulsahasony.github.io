  <script src="/assets/profile.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Render experience
      const experienceContainer = document.getElementById('experience-container');
      if (experienceContainer && profile.experience) {
        experienceContainer.innerHTML = profile.experience.map(exp => `
          <div class="card experience-card">
            <div class="experience-header">
              <div>
                <h3 class="experience-title">${exp.role}</h3>
                <div class="experience-company">${exp.company}</div>
                <div class="experience-dates">${exp.dates}</div>
                <div class="experience-location">${exp.location}</div>
              </div>
            </div>
            <ul class="experience-list">
              ${exp.bullets.map(bullet => `<li>${bullet}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      }
      
      // Render volunteering
      const volunteeringContainer = document.getElementById('volunteering-container');
      if (volunteeringContainer && profile.volunteering) {
        volunteeringContainer.innerHTML = profile.volunteering.map(vol => `
          <div class="card experience-card">
            <div class="experience-header">
              <div>
                <h3 class="experience-title">${vol.role}</h3>
                <div class="experience-company">${vol.organization}</div>
                <div class="experience-dates">${vol.dates}</div>
                ${vol.event ? `<div class="experience-event">${vol.event}</div>` : ''}
              </div>
            </div>
            ${vol.description ? `
              <ul class="experience-list">
                ${vol.description.map(desc => `<li>${desc}</li>`).join('')}
              </ul>
            ` : ''}
          </div>
        `).join('');
      }
    });
  </script>
