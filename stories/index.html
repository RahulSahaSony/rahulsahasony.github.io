  <script>
    // Sample stories data (in a real implementation, this would come from a database or API)
    const stories = [
      {
        id: 1,
        title: "My Journey",
        excerpt: "How I transitioned from finance to data analytics and the lessons I learned along the way.",
        content: `
          <p>My journey into data analytics wasn't a straight path. I started my career in finance, working with numbers and spreadsheets, but I always felt there was more to discover in the data.</p>
          <p>The turning point came when I was working at Wonderlo Inc. We were dealing with massive amounts of advertising data, and I realized that traditional spreadsheet analysis wasn't enough. I needed to learn programming and statistical methods to truly understand the patterns.</p>
          <p>I started with Python, then moved to R, and finally pursued a Master's in Business Analytics. Each step opened new doors and perspectives on how data can drive decisions.</p>
          <p>Today, I work at the intersection of business and technology, helping organizations make sense of their data and turn it into actionable insights.</p>
        `,
        date: "2026-01-26",
        image: "/assets/story1.png"
      }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const storiesContainer = document.getElementById('stories-container');
      const storyModal = document.getElementById('story-modal');
      const storyModalBody = document.getElementById('story-modal-body');
      const storyModalClose = document.getElementById('story-modal-close');

      // Render stories
      function renderStories() {
        storiesContainer.innerHTML = stories.map(story => `
          <div class="story-card" data-id="${story.id}">
            <div class="story-image">
              <img src="${story.image}" alt="${story.title}">
            </div>
            <div class="story-content">
              <h3 class="story-title">${story.title}</h3>
              <div class="story-date">${formatDate(story.date)}</div>
              <p class="story-excerpt">${story.excerpt}</p>
              <div class="story-actions">
                <button class="story-read-more" data-id="${story.id}">Read More</button>
                <button class="story-share" data-id="${story.id}">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                    <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        `).join('');

        // Add event listeners
        document.querySelectorAll('.story-read-more').forEach(button => {
          button.addEventListener('click', function() {
            const storyId = parseInt(this.getAttribute('data-id'));
            openStoryModal(storyId);
          });
        });

        document.querySelectorAll('.story-share').forEach(button => {
          button.addEventListener('click', function() {
            const storyId = parseInt(this.getAttribute('data-id'));
            shareStory(storyId);
          });
        });
      }

      // Open story modal
      function openStoryModal(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (!story) return;

        storyModalBody.innerHTML = `
          <div class="story-full">
            <div class="story-full-image">
              <img src="${story.image}" alt="${story.title}">
            </div>
            <div class="story-full-content">
              <div class="story-full-date">${formatDate(story.date)}</div>
              <h2 class="story-full-title">${story.title}</h2>
              <div class="story-full-text">
                ${story.content}
              </div>
              <div class="story-full-actions">
                <button class="story-share" data-id="${story.id}">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                    <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Share
                </button>
              </div>
            </div>
          </div>
        `;

        storyModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }

      // Close story modal
      function closeStoryModal() {
        storyModal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }

      // Share story
      function shareStory(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (story) {
          if (navigator.share) {
            navigator.share({
              title: story.title,
              text: story.excerpt,
              url: window.location.href + '#story-' + storyId
            });
          } else {
            // Fallback: copy to clipboard
            const url = window.location.href + '#story-' + storyId;
            navigator.clipboard.writeText(url).then(() => {
              alert('Link copied to clipboard!');
            });
          }
        }
      }

      // Format date
      function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString(undefined, options);
      }

      // Event listeners
      storyModalClose.addEventListener('click', closeStoryModal);
      storyModal.addEventListener('click', function(e) {
        if (e.target === storyModal) {
          closeStoryModal();
        }
      });

      // Initialize
      renderStories();
    });
  </script>
