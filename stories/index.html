  <script>
    // Sample stories data (in a real implementation, this would come from a database or API)
    const stories = [
      {
        id: 1,
        title: "My Journey",
        excerpt: "How I transitioned from finance to data analytics and the lessons I learned along the way.",
        content: `
          <p>My journey has never been a straight line. It has been shaped by progress, pauses, and the constant tension between doubt and confidence.</p>

          <p>I grew up in Bangladesh, where poverty and limited opportunities shape daily life. I saw it around me, and I lived it myself. As a teenager, I dreamed of becoming an engineer. But financial reality changed that plan; I had to shift into commerce instead. That moment was one of my earliest downs. It felt unfair and discouraging. But it also taught me something important early in life: when one door closes, you do not stop moving. You adapt. You find another way forward.</p>
          
          <p>I began with a Bachelor of Business Administration in Finance, Banking, and Insurance. At that stage, my goal was simple: understand how money, risk, and decisions work in the real world. I felt hopeful and motivated. I believed that education alone would open doors. That belief was my first high point. Soon after, reality introduced its first low. The professional world was more competitive and uncertain than I expected. Effort did not always lead to immediate results.</p>
          
          <p>After graduation, I stepped into the professional world. I led growth initiatives, supported publishers, analyzed performance data, and helped launch campaigns. I quickly realized something important. Many decisions were made without data, without structure, and without clarity. That curiosity became a turning point. I wanted to understand how better decisions could be made. But curiosity alone was not enough. I lacked the technical skills to go deeper, and that gap often made me feel stuck.</p>
          
          <p>Moving to the United States was one of the biggest turning points of my life. It was exciting, but it came with new systems, new expectations, and constant pressure to prove myself. I enrolled in the Master of Science in Business Analytics at The George Washington University knowing it would be difficult. I underestimated just how difficult it would be. The program challenged me in ways I had not experienced before. Statistics, data management, optimization, time series forecasting, and responsible machine learning were not easy subjects. Instead of stepping back, I slowed down. I relearned basics, practiced more, and accepted that growth does not always feel confident.</p>
          
          <p>Outside of classes, I volunteered and stayed active in professional organizations. These experiences grounded me. They are part of long-term growth, especially for someone navigating a new country, a new system, and high expectations.</p>
          
          <p>There were periods of waiting. Waiting for opportunities. Waiting for clarity. Waiting for momentum to return. Those quiet stretches taught me patience. I learned that progress does not always show results immediately, but it still counts. Over time, I became more comfortable with uncertainty. I learned to take ownership of my work and support teams wherever needed. I do not claim to know everything on day one, but I learn fast and take feedback seriously. I value clear processes, clean data, and delivering results on time. </p>
          
          <p>Today, my journey sits at the intersection of data, business, and impact. I work with Python, R, SQL, and machine learning models. I am still learning, and I expect that never to change.</p>
          
          <p>This journey is not a success story with a clean ending. It is a work in progress. What defines it is not where I started or where I am now, but how I continue to adapt, learn, and move forward. If there is one thing my journey has taught me, it is this: progress is rarely loud. It happens quietly, over time, through choices you make when no one is watching.</p>
        `,
        date: "2026-02-06",
        image: "/assets/story1.png"
      },
      {
        id: 2,
        title: "The Work Behind the Work",
        excerpt: "The invisible hours, quiet decisions, and learning that shape every finished piece.",
        content: `
          <p>I haven't finished that story yet. Hope soon.</p>
        `,

document.addEventListener('DOMContentLoaded', function() {
  const storiesContainer = document.getElementById('stories-container');
  const storyModal = document.getElementById('story-modal');
  const storyModalBody = document.getElementById('story-modal-body');
  const storyModalClose = document.getElementById('story-modal-close');

  // Render stories
  function renderStories() {
    storiesContainer.innerHTML = stories.map(story => `
      <div class="story-card" data-id="${story.id}">
        <div class="story-image">
          <img src="${story.image}" alt="${story.title}">
        </div>
        <div class="story-content">
          <h3 class="story-title">${story.title}</h3>
          <div class="story-date">${formatDate(story.date)}</div>
          <p class="story-excerpt">${story.excerpt}</p>
          <div class="story-actions">
            <button class="story-read-more" data-id="${story.id}">Read More</button>
          </div>
        </div>
      </div>
    `).join('');

    // Add event listeners to story cards
    document.querySelectorAll('.story-card').forEach(card => {
      card.addEventListener('click', function(e) {
        const storyId = parseInt(this.getAttribute('data-id'));
        openStoryModal(storyId);
      });
    });
  }

      // Open story modal
      function openStoryModal(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (!story) return;

        storyModalBody.innerHTML = `
          <div class="story-full">
            <div class="story-full-image">
              <img src="${story.image}" alt="${story.title}">
            </div>
            <div class="story-full-content">
              <div class="story-full-date">${formatDate(story.date)}</div>
              <h2 class="story-full-title">${story.title}</h2>
              <div class="story-full-text">
                ${story.content}
              </div>
            </div>
          </div>
        `;

        storyModal.classList.add('open');
        document.getElementById('story-modal-body').scrollTop = 0;
        document.body.style.overflow = 'hidden';
      }

      // Close story modal
      function closeStoryModal() {
        storyModal.classList.remove('open');
        document.body.style.overflow = 'auto';
      }

      // Share story
      function shareStory(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (story) {
          if (navigator.share) {
            navigator.share({
              title: story.title,
              text: story.excerpt,
              url: window.location.href + '#story-' + storyId
            });
          } else {
            // Fallback: copy to clipboard
            const url = window.location.href + '#story-' + storyId;
            navigator.clipboard.writeText(url).then(() => {
              alert('Link copied to clipboard!');
            });
          }
        }
      }

      // Format date
      function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString(undefined, options);
      }

      // Event listeners
      storyModalClose.addEventListener('click', closeStoryModal);
      storyModal.addEventListener('click', function(e) {
        if (e.target === storyModal) {
          closeStoryModal();
        }
      });

      // Initialize
      renderStories();
    });
  </script>
