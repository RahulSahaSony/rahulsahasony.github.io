  <script>
    // Sample stories data (in a real implementation, this would come from a database or API)
    const stories = [
      {
        id: 1,
        title: "My Journey into Data Analytics",
        excerpt: "How I transitioned from finance to data analytics and the lessons I learned along the way.",
        content: `
          <p>My journey into data analytics wasn't a straight path. I started my career in finance, working with numbers and spreadsheets, but I always felt there was more to discover in the data.</p>
          <p>The turning point came when I was working at Wonderlo Inc. We were dealing with massive amounts of advertising data, and I realized that traditional spreadsheet analysis wasn't enough. I needed to learn programming and statistical methods to truly understand the patterns.</p>
          <p>I started with Python, then moved to R, and finally pursued a Master's in Business Analytics. Each step opened new doors and perspectives on how data can drive decisions.</p>
          <p>Today, I work at the intersection of business and technology, helping organizations make sense of their data and turn it into actionable insights.</p>
        `,
        date: "2023-11-15",
        image: "/assets/story1.jpg",
        tags: ["Career", "Data Analytics", "Transition"],
        likes: 24,
        comments: [
          { author: "Alex Chen", text: "Great story! I'm also transitioning from finance to data.", date: "2023-11-16" },
          { author: "Sarah Johnson", text: "Your journey is inspiring. What resources helped you the most?", date: "2023-11-17" }
        ]
      },
      {
        id: 2,
        title: "Building My First Machine Learning Model",
        excerpt: "The challenges and triumphs of creating my first predictive model from scratch.",
        content: `
          <p>Building my first machine learning model was both exciting and terrifying. I decided to predict customer churn for a fictional telecom company using Python and scikit-learn.</p>
          <p>The biggest challenge wasn't the code—it was understanding the data. I spent weeks cleaning, transforming, and exploring the dataset before even thinking about algorithms.</p>
          <p>When I finally ran the model and got 85% accuracy, I was ecstatic. But then I realized accuracy wasn't everything. I needed to understand precision, recall, and the business impact of false positives vs. false negatives.</p>
          <p>This project taught me that machine learning is as much about business understanding as it is about algorithms.</p>
        `,
        date: "2023-10-28",
        image: "/assets/story2.jpg",
        tags: ["Machine Learning", "Python", "First Project"],
        likes: 42,
        comments: [
          { author: "Mike Rodriguez", text: "I remember my first ML model. Such a learning experience!", date: "2023-10-29" },
          { author: "Emily Watson", text: "Did you use any specific resources for learning ML?", date: "2023-10-30" }
        ]
      },
      {
        id: 3,
        title: "The Power of Data Visualization",
        excerpt: "How a well-designed dashboard changed everything for a client's decision-making process.",
        content: `
          <p>I once worked with a client who was drowning in spreadsheets. They had tons of data but couldn't see the patterns. I created an interactive dashboard using Power BI that transformed their decision-making process.</p>
          <p>The key was focusing on what mattered to them. Instead of showing every possible metric, I highlighted the 5-6 KPIs that drove their business.</p>
          <p>The result? Their team went from spending hours analyzing data to making informed decisions in minutes. The CEO told me it was like turning on a light in a dark room.</p>
          <p>This experience reinforced my belief that data visualization isn't just about pretty charts—it's about clarity and action.</p>
        `,
        date: "2023-10-12",
        image: "/assets/story3.jpg",
        tags: ["Data Visualization", "Power BI", "Business Impact"],
        likes: 38,
        comments: [
          { author: "David Kim", text: "This is so true. Good visualization makes all the difference.", date: "2023-10-13" },
          { author: "Lisa Anderson", text: "Do you have any tips for choosing the right charts?", date: "2023-10-14" }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const storiesContainer = document.getElementById('stories-container');
      const storyModal = document.getElementById('story-modal');
      const storyModalBody = document.getElementById('story-modal-body');
      const storyModalClose = document.getElementById('story-modal-close');

      // Render stories
      function renderStories() {
        storiesContainer.innerHTML = stories.map(story => `
          <div class="story-card" data-id="${story.id}">
            <div class="story-image">
              <img src="${story.image}" alt="${story.title}">
            </div>
            <div class="story-content">
              <div class="story-meta">
                <span class="story-date">${formatDate(story.date)}</span>
                <div class="story-tags">
                  ${story.tags.map(tag => `<span class="story-tag">${tag}</span>`).join('')}
                </div>
              </div>
              <h3 class="story-title">${story.title}</h3>
              <p class="story-excerpt">${story.excerpt}</p>
              <div class="story-actions">
                <button class="story-read-more" data-id="${story.id}">Read More</button>
                <div class="story-stats">
                  <button class="story-like" data-id="${story.id}">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>${story.likes}</span>
                  </button>
                  <button class="story-comment" data-id="${story.id}">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>${story.comments.length}</span>
                  </button>
                  <button class="story-share" data-id="${story.id}">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                      <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');

        // Add event listeners
        document.querySelectorAll('.story-read-more').forEach(button => {
          button.addEventListener('click', function() {
            const storyId = parseInt(this.getAttribute('data-id'));
            openStoryModal(storyId);
          });
        });

        document.querySelectorAll('.story-like').forEach(button => {
          button.addEventListener('click', function() {
            const storyId = parseInt(this.getAttribute('data-id'));
            toggleLike(storyId);
          });
        });

        document.querySelectorAll('.story-comment').forEach(button => {
          button.addEventListener('click', function() {
            const storyId = parseInt(this.getAttribute('data-id'));
            openStoryModal(storyId);
          });
        });

        document.querySelectorAll('.story-share').forEach(button => {
          button.addEventListener('click', function() {
            const storyId = parseInt(this.getAttribute('data-id'));
            shareStory(storyId);
          });
        });
      }

      // Open story modal
      function openStoryModal(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (!story) return;

        storyModalBody.innerHTML = `
          <div class="story-full">
            <div class="story-full-image">
              <img src="${story.image}" alt="${story.title}">
            </div>
            <div class="story-full-content">
              <div class="story-full-meta">
                <span class="story-date">${formatDate(story.date)}</span>
                <div class="story-tags">
                  ${story.tags.map(tag => `<span class="story-tag">${tag}</span>`).join('')}
                </div>
              </div>
              <h2 class="story-full-title">${story.title}</h2>
              <div class="story-full-text">
                ${story.content}
              </div>
              <div class="story-full-actions">
                <div class="story-stats">
                  <button class="story-like" data-id="${story.id}">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>${story.likes}</span>
                  </button>
                  <button class="story-comment" data-id="${story.id}">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>${story.comments.length}</span>
                  </button>
                  <button class="story-share" data-id="${story.id}">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                      <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
              
              <div class="story-comments">
                <h3>Comments (${story.comments.length})</h3>
                <div class="comment-form">
                  <textarea placeholder="Share your thoughts..." id="comment-text-${storyId}"></textarea>
                  <button class="btn" onclick="addComment(${storyId})">Post Comment</button>
                </div>
                <div class="comments-list">
                  ${story.comments.map(comment => `
                    <div class="comment">
                      <div class="comment-header">
                        <span class="comment-author">${comment.author}</span>
                        <span class="comment-date">${formatDate(comment.date)}</span>
                      </div>
                      <p class="comment-text">${comment.text}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;

        storyModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }

      // Close story modal
      function closeStoryModal() {
        storyModal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }

      // Toggle like
      function toggleLike(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (story) {
          story.likes += 1;
          renderStories();
        }
      }

      // Share story
      function shareStory(storyId) {
        const story = stories.find(s => s.id === storyId);
        if (story) {
          if (navigator.share) {
            navigator.share({
              title: story.title,
              text: story.excerpt,
              url: window.location.href + '#story-' + storyId
            });
          } else {
            // Fallback: copy to clipboard
            const url = window.location.href + '#story-' + storyId;
            navigator.clipboard.writeText(url).then(() => {
              alert('Link copied to clipboard!');
            });
          }
        }
      }

      // Add comment
      function addComment(storyId) {
        const commentText = document.getElementById(`comment-text-${storyId}`).value;
        if (commentText.trim()) {
          const story = stories.find(s => s.id === storyId);
          if (story) {
            story.comments.push({
              author: "You",
              text: commentText,
              date: new Date().toISOString().split('T')[0]
            });
            openStoryModal(storyId); // Refresh the modal
          }
        }
      }

      // Format date
      function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString(undefined, options);
      }

      // Event listeners
      storyModalClose.addEventListener('click', closeStoryModal);
      storyModal.addEventListener('click', function(e) {
        if (e.target === storyModal) {
          closeStoryModal();
        }
      });

      // Initialize
      renderStories();
    });
  </script>
</body>
